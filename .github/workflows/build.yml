name: Build LoR 60 FPS Unlocker APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Copy and rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LoR-60FPS-Unlocker.apk
          ls -lh dist/LoR-60FPS-Unlocker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoR-60FPS-Unlocker-APK
          path: dist/LoR-60FPS-Unlocker.apk

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoR-60FPS-Unlocker.apk
